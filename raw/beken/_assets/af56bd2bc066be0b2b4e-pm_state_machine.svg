<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b9bd5"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2f5f8f" flood-opacity="0.25"/>
    </filter>
    <style>
      .node { fill: #5b9bd5; stroke: #ffffff; stroke-width: 2; filter: url(#shadow); }
      .label { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 26px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
      .small-label { fill: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
      .edge { stroke: #5b9bd5; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .edge-text { fill: #5b9bd5; font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 600; text-anchor: middle; }
      .edge-text-small { fill: #5b9bd5; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 600; text-anchor: middle; }
      .title { fill: #3f78b5; font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="620" fill="#ffffff"/>
  <text class="title" x="480" y="42">BK7259 Power Management State Machine</text>

  <polygon class="node" points="480,190 580,250 580,370 480,430 380,370 380,250"/>
  <text class="label" x="480" y="310">active</text>

  <rect class="node" x="670" y="95" width="185" height="78" rx="6"/>
  <text class="small-label" x="762.5" y="134">normal sleep</text>

  <rect class="node" x="690" y="330" width="185" height="78" rx="6"/>
  <text class="small-label" x="782.5" y="369">sleep mode</text>

  <rect class="node" x="105" y="330" width="185" height="78" rx="6"/>
  <text class="small-label" x="197.5" y="369">deep sleep</text>

  <rect class="node" x="100" y="95" width="215" height="92" rx="6"/>
  <text class="small-label" x="207.5" y="126">shut down</text>
  <text class="small-label" x="207.5" y="154">(super deep sleep)</text>

  <rect class="node" x="384" y="510" width="192" height="74" rx="6"/>
  <text class="small-label" x="480" y="547">power down</text>

  <path class="edge" d="M580,255 L670,160"/>
  <text class="edge-text" x="655" y="220">WFI</text>

  <path class="edge" d="M670,125 L560,245"/>
  <text class="edge-text" x="628" y="146">INTs</text>

  <path class="edge" d="M580,340 L690,360"/>
  <text class="edge-text" x="685" y="330">APP set sleep mode</text>

  <path class="edge" d="M690,392 L580,372"/>
  <text class="edge-text-small" x="720" y="430">INTs(GPIO/RTC(RTC,WIFI MAC, BTDM)/Touch/vad)</text>

  <path class="edge" d="M380,340 L290,360"/>
  <text class="edge-text" x="285" y="330">APP set deep sleep</text>

  <path class="edge" d="M290,392 L380,372"/>
  <text class="edge-text-small" x="318" y="430">INTs(GPIO/RTC/Touch/vad)</text>

  <path class="edge" d="M400,256 L315,171"/>
  <text class="edge-text" x="320" y="230">INTs(GPIO/RTC)</text>

  <path class="edge" d="M315,139 L410,234"/>
  <text class="edge-text" x="430" y="150">APP set super deep sleep</text>

  <path class="edge" d="M460,418 L460,510"/>
  <text class="edge-text" x="400" y="475">power off</text>

  <path class="edge" d="M500,510 L500,418"/>
  <text class="edge-text" x="565" y="475">power on</text>
</svg>
